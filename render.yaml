services:
  - type: web
    name: kali-nexus
    env: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
