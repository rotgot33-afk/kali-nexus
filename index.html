<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="description" content="نظام Kali Linux الخيالي — طرفية حقيقية، خرائط تهديدات، ذكاء اصطناعي" />
    <meta name="theme-color" content="#00ff41" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS OS" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root">
      <!-- Loading fallback shown until React mounts. If users see this forever, JS failed. -->
      <div style="position:fixed;inset:0;background:#000;color:#00ff41;font-family:monospace;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center;">
        <div style="font-size:24px;font-weight:bold;">🐉 KALI NEXUS</div>
        <div style="font-size:12px;opacity:0.7;">Loading... if this stays, hard refresh (Ctrl+Shift+R)</div>
        <div style="width:60px;height:2px;background:linear-gradient(90deg,transparent,#00ff41,transparent);animation:pulse 1.5s infinite;"></div>
      </div>
      <style>@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force-unregister any old Service Worker (kali-linux-v1) that may be showing white screen
      (async function() {
        if ('serviceWorker' in navigator) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              // Unregister old SWs to force fresh registration with new network-first SW
              await reg.unregister();
              console.log('[Bootstrap] Unregistered old SW');
            }
            // Clear all old caches
            const cacheNames = await caches.keys();
            for (const name of cacheNames) {
              await caches.delete(name);
              console.log('[Bootstrap] Cleared cache:', name);
            }
            // Register fresh SW
            await navigator.serviceWorker.register('/sw.js');
            console.log('[Bootstrap] New SW registered');
          } catch (e) {
            console.warn('[Bootstrap] SW cleanup failed:', e);
          }
        }
      })();
    </script>
  </body>
</html>
